version: '3.8'

services:
  ollama:
    image: docker.m.daocloud.io/ollama/ollama:latest
    container_name: ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trilium-agent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./frontend:/frontend
    environment:
      - PYTHONPATH=/app
      - LLM_MODEL_TYPE=ollama
      - LLM_MODEL_PATH=qwen2.5:1.5b
      - OPENAI_API_BASE=http://ollama:11434
      - HF_ENDPOINT=https://hf-mirror.com
    restart: unless-stopped

