<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilium Knowledge Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <h1>Trilium Agent</h1>
                </div>
            </div>
            
            <div class="sidebar-content">
                <div class="config-group">
                    <label>Auth Token</label>
                    <input type="password" id="api-key-input" placeholder="输入 X-API-Key" class="glass-input">
                </div>
                
                <div class="status-panel">
                    <h3>系统大盘</h3>
                    <div class="status-item">
                        <span>LLM状态:</span>
                        <span id="status-llm" class="badge warning">检测中</span>
                    </div>
                    <div class="status-item">
                        <span>向量库:</span>
                        <span id="status-vector" class="badge warning">检测中</span>
                    </div>
                    <div class="status-item">
                        <span>重排器:</span>
                        <span id="status-reranker" class="badge warning">检测中</span>
                    </div>
                </div>

                <div class="action-group">
                    <button id="btn-sync" class="glass-btn primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-8.31l-5.67-1.25"/></svg>
                        同步知识库
                    </button>
                    <button id="btn-clear" class="glass-btn danger">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        清空上下文
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <h2>智能问答</h2>
                <div class="session-id">Session: <span id="session-display">生成中...</span></div>
            </header>
            
            <div class="chat-history" id="chat-history">
                <!-- Messages will be injected here -->
                <div class="message system">
                    <div class="avatar">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
                    </div>
                    <div class="content">
                        你好！我是 Trilium 知识库助手。我已经准备好回答关于您的笔记的任何问题了。
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper glass-panel">
                    <textarea id="chat-input" placeholder="向知识库提问 (Shift + Enter 换行)..." rows="1"></textarea>
                    <button id="btn-send" class="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </main>
        
        <!-- Toast Notification -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <script src="/assets/script.js"></script>
</body>
</html>
